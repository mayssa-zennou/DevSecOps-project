# Rôle du n?ud
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9094

# Les deux listeners
listeners=EXTERNAL://0.0.0.0:9092,CONTROLLER://127.0.0.1:9094
advertised.listeners=EXTERNAL://localhost:9092
listener.security.protocol.map=EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=EXTERNAL

#TLS
ssl.keystore.location=/etc/kafka/secrets/kafka.keystore.p12
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/client.truststore.p12
ssl.truststore.type=PKCS12
ssl.enabled.protocols=TLSv1.3
ssl.client.auth=none

# SASL/SCRAM
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

# Autorisation
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false

# N?ud unique (repris de votre compose)
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=false

# Stockage
log.dirs=/var/lib/kafka/data