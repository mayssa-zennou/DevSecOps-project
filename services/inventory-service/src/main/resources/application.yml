server:
    port: 8082

spring:
    application:
        name: inventory-service
    datasource:
        url: jdbc:postgresql://localhost:5433/inventory
        username: mayssa
        password: inventory
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                format_sql: true